[project]
name = "polya-backend"
version = "1.0.0"
description = "Pólya: local-first POMDP learning companion (FastAPI + SQLite backend)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115", "uvicorn[standard]>=0.30", "pydantic>=2.7", "httpx>=0.27", "sympy>=1.13",
  "numpy>=1.26", "scipy>=1.13", "watchdog>=4.0", "pypdf>=4.2", "websockets>=12.0",
]

[project.optional-dependencies]
test = ["pytest>=8.2", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
